{% extends "base.html" %}

{% block title %} Tag Form {% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4 fw-bold">Tag Form</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'todolist:tags' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
