{% extends "base.html" %}

{% block title %}Delete Task {% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2 class="mb-4 text-danger">Delete Task</h2>

    <p>Are you sure you want to delete the task: <strong>"{{ object.content }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'todolist:home' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
