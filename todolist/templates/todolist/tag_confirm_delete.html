{% extends "base.html" %}

{% block title %} Delete Tag {% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card p-4 shadow-sm border-0">
        <h2 class="mb-3 text-danger fw-bold">Delete Tag</h2>
        <p class="fs-5">Are you sure you want to delete the tag <strong>"{{ tag.name }}"</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-danger">Confirm</button>
                <a href="{% url 'todolist:tags' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
